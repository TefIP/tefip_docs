site_name: TEF IP Docs
site_url: https://tefip.github.io/tefip_docs/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
  font:
    text: DM Sans
    code: DM Mono
  features:
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - search.highlight

extra_css:
  - styles/extra.css

extra_javascript:
  - scripts/extra.js

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list

exclude_docs: |
  superpowers/

nav:
  - Início: index.md
  - Guia de Integração:
    - Primeiros Passos: getting-started.md
    - Testando com Emulador: emulator.md
    - Comportamento: comportamento.md
  - API Reference:
    - Visão Geral de Erros: api/erros.md
    - Vendas: api/sale.md
    - Coleta de Dados: api/ask.md
    - Impressão: api/print.md
    - Visor do Terminal: api/display.md
    - Transações: api/transaction.md
    - Status e Manutenção: api/status.md
    - Logs: api/logs.md
    - Notificações: api/notification.md
    - Especificação (Swagger): api/swagger.md
  - SDKs:
    - Visão geral: sdks.md
    - Dart (Oficial): sdk-dart.md
    - JavaScript: sdk-js.md
    - PHP: sdk-php.md
    - Ruby: sdk-ruby.md
  - Suporte e Operações:
    - Versões e Requisitos: suporte/versoes-requisitos.md
    - Resolução de Problemas: suporte/resolucao-de-problemas.md
